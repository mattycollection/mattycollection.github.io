<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ventas · Registrar</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f4f8;
    --surface: #ffffff;
    --card: #ffffff;
    --border: #e2e2ec;
    --accent: #6c63ff;
    --accent-dark: #5a52e8;
    --accent2: #ff6584;
    --accent3: #43e97b;
    --text: #1a1a2e;
    --muted: #8888a8;
    --danger: #ff4757;
    --warn: #ffa502;
    --success: #2ed573;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  /* TOP BAR */
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 64px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 1px 12px rgba(0,0,0,.06);
  }
  .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 18px; }
  .logo span { color: var(--accent); }
  .topbar-right { display: flex; align-items: center; gap: 14px; }
  .date-badge {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 14px;
    font-size: 13px; color: var(--muted); font-weight: 500;
  }
  .counter-badge {
    background: var(--accent); color: #fff;
    border-radius: 8px; padding: 6px 14px;
    font-size: 13px; font-weight: 600;
  }

  /* LAYOUT */
  .layout {
    max-width: 1100px;
    margin: 32px auto;
    padding: 0 20px;
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 24px;
  }

  /* CARD */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 2px 16px rgba(0,0,0,.05);
  }
  .card-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap;
  }
  .card-header h2 { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 16px; }
  .card-body { padding: 24px; }

  /* FORM */
  .form-group { margin-bottom: 18px; }
  label {
    display: block; font-size: 12px; color: var(--muted);
    font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
    margin-bottom: 8px;
  }
  .form-control {
    width: 100%; padding: 12px 16px;
    border: 1.5px solid var(--border); border-radius: 10px;
    font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--text);
    background: var(--surface); outline: none; transition: border-color .2s;
    -webkit-appearance: none;
  }
  .form-control:focus { border-color: var(--accent); }
  select.form-control { cursor: pointer; }

  /* QUANTITY INPUT */
  .qty-wrap { display: flex; gap: 10px; align-items: center; }
  .qty-btn {
    width: 44px; height: 44px; border-radius: 10px;
    border: 1.5px solid var(--border); background: var(--bg);
    font-size: 20px; cursor: pointer; display: flex;
    align-items: center; justify-content: center; color: var(--text);
    transition: all .15s; flex-shrink: 0;
  }
  .qty-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .qty-input {
    flex: 1; text-align: center;
    border: 1.5px solid var(--border); border-radius: 10px;
    padding: 11px; font-size: 18px; font-weight: 700;
    font-family: 'Syne', sans-serif; color: var(--text);
    background: var(--surface); outline: none;
  }
  .qty-input:focus { border-color: var(--accent); }

  /* PRODUCT CARD PREVIEW */
  .product-preview {
    background: var(--bg); border-radius: 12px;
    padding: 16px; margin-bottom: 18px;
    display: none; border: 1.5px solid var(--border);
  }
  .product-preview.show { display: block; }
  .preview-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .preview-name { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 18px; margin: 4px 0 10px; }
  .preview-stock { display: flex; gap: 12px; }
  .preview-stock-item { font-size: 13px; }
  .preview-stock-item strong { font-weight: 700; color: var(--accent); }

  /* SUBMIT BTN */
  .btn-submit {
    width: 100%; padding: 15px;
    background: var(--accent); color: #fff;
    border: none; border-radius: 12px;
    font-size: 16px; font-weight: 700;
    font-family: 'Syne', sans-serif;
    cursor: pointer; transition: all .2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    letter-spacing: .01em;
  }
  .btn-submit:hover { background: var(--accent-dark); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(108,99,255,.3); }
  .btn-submit:active { transform: translateY(0); }
  .btn-submit:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; transform: none; box-shadow: none; }

  /* MINI STATS */
  .mini-stats {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; margin-bottom: 20px;
  }
  .mini-stat {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px;
    text-align: center;
  }
  .mini-stat-val { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 24px; }
  .mini-stat-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }

  /* RECENT SALES */
  .sales-list { display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow-y: auto; }
  .sale-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    background: var(--bg); border-radius: 10px;
    border: 1px solid var(--border);
    animation: fadeIn .3s ease;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
  .sale-avatar {
    width: 36px; height: 36px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif; font-weight: 800; font-size: 14px; color: #fff;
    flex-shrink: 0;
  }
  .sale-body { flex: 1; min-width: 0; }
  .sale-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sale-time { font-size: 11px; color: var(--muted); }
  .sale-qty {
    background: rgba(108,99,255,.1); color: var(--accent);
    font-weight: 700; font-family: 'Syne', sans-serif;
    border-radius: 7px; padding: 4px 10px; font-size: 13px;
    white-space: nowrap;
  }

  /* SUCCESS OVERLAY */
  .success-overlay {
    position: fixed; inset: 0; z-index: 999;
    background: rgba(255,255,255,.95);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
    animation: fadeInOverlay .25s ease;
  }
  .success-overlay.show { display: flex; }
  @keyframes fadeInOverlay { from{opacity:0} to{opacity:1} }
  .success-icon {
    width: 80px; height: 80px; border-radius: 50%;
    background: linear-gradient(135deg, #43e97b, #38f9d7);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    animation: popIn .4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn { from{transform:scale(0)} to{transform:scale(1)} }
  .success-title { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 24px; color: var(--text); }
  .success-sub { color: var(--muted); font-size: 15px; text-align: center; }

  /* TOAST */
  .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 998; display: flex; flex-direction: column; gap: 10px; }
  .toast {
    background: #1a1a2e; color: #fff;
    border-radius: 10px; padding: 12px 18px;
    font-size: 13px; min-width: 220px;
    display: flex; align-items: center; gap: 10px;
    animation: toastIn .3s ease;
    box-shadow: 0 8px 32px rgba(0,0,0,.2);
  }
  @keyframes toastIn { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:translateX(0)} }
  .toast-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* EMPTY */
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty svg { width: 40px; height: 40px; margin-bottom: 10px; opacity: .4; }
  .empty p { font-size: 13px; }

  /* HAMBURGER responsive */
  .mobile-topbar-title { display: none; font-family: 'Syne', sans-serif; font-weight: 700; }

  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; margin: 16px auto; padding: 0 12px; gap: 16px; }
    .topbar { padding: 0 16px; }
    .card-body { padding: 18px; }
    .date-badge { display: none; }
  }
  @media (max-width: 480px) {
    .logo { font-size: 15px; }
    .mini-stats { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="logo">⬡ <span>VENTAS</span> · Registro</div>
  <div class="topbar-right">
    <div class="date-badge" id="dateDisplay">—</div>
    <div class="counter-badge" id="sessionCounter">0 ventas hoy</div>
  </div>
</div>

<!-- LAYOUT -->
<div class="layout">

  <!-- FORMULARIO -->
  <div>
    <div class="card">
      <div class="card-header">
        <h2>Registrar Nueva Venta</h2>
        <span style="font-size:12px;color:var(--muted)">Selecciona producto y cantidad</span>
      </div>
      <div class="card-body">

        <div class="form-group">
          <label>Producto</label>
          <select class="form-control" id="selProducto" onchange="onProductoChange()">
            <option value="">Cargando productos…</option>
          </select>
        </div>

        <!-- PREVIEW -->
        <div class="product-preview" id="preview">
          <div class="preview-label">Seleccionado</div>
          <div class="preview-name" id="previewNombre">—</div>
          <div class="preview-stock">
            <div class="preview-stock-item">Stock disponible: <strong id="previewStock">—</strong></div>
          </div>
        </div>

        <div class="form-group">
          <label>Cantidad Vendida</label>
          <div class="qty-wrap">
            <button class="qty-btn" onclick="changeQty(-1)">−</button>
            <input type="number" class="qty-input" id="cantidad" value="1" min="1">
            <button class="qty-btn" onclick="changeQty(1)">+</button>
          </div>
        </div>

        <div class="form-group">
          <label>Nota (opcional)</label>
          <input class="form-control" id="nota" placeholder="Ej: cliente frecuente, descuento…">
        </div>

        <button class="btn-submit" id="btnRegistrar" onclick="registrarVenta()">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          Registrar Venta
        </button>

      </div>
    </div>
  </div>

  <!-- PANEL DERECHO -->
  <div style="display:flex;flex-direction:column;gap:16px">

    <!-- MINI STATS -->
    <div class="card">
      <div class="card-body" style="padding:18px">
        <div class="mini-stats">
          <div class="mini-stat">
            <div class="mini-stat-val" id="statHoy">0</div>
            <div class="mini-stat-label">Ventas Hoy</div>
          </div>
          <div class="mini-stat">
            <div class="mini-stat-val" id="statUnidades">0</div>
            <div class="mini-stat-label">Unidades</div>
          </div>
        </div>
      </div>
    </div>

    <!-- RECIENTES -->
    <div class="card" style="flex:1">
      <div class="card-header">
        <h2>Ventas Recientes</h2>
        <button onclick="loadData()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px">↻ Recargar</button>
      </div>
      <div class="card-body" style="padding:16px">
        <div id="recentList">
          <div class="empty">
            <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
            <p>Las ventas aparecerán aquí</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- SUCCESS OVERLAY -->
<div class="success-overlay" id="successOverlay">
  <div class="success-icon">✓</div>
  <div class="success-title">¡Venta Registrada!</div>
  <div class="success-sub" id="successMsg">Guardado correctamente</div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyml_wBOufq5PccU6eOjMeN71bmkFzW3LE1EF7DoQH5ZLBpkFrLs91AKfGchJ7aWPgFkA/exec";

let productos = [];
let recentSales = [];
let sessionCount = 0;
let sessionUnits = 0;

// ─── DATE ───
function updateDate() {
  const now = new Date();
  const opts = { weekday:'long', day:'numeric', month:'long' };
  document.getElementById('dateDisplay').textContent = now.toLocaleDateString('es-ES', opts);
}
updateDate();

// ─── LOAD ───
async function callSheet(action, payload = {}) {
  const params = new URLSearchParams({action, ...payload});
  const res = await fetch(SCRIPT_URL + '?' + params);
  const text = await res.text();
  try { return JSON.parse(text); } catch { return {ok:false, error:text}; }
}

async function loadData() {
  try {
    const [pRes, vRes] = await Promise.all([
      callSheet('getProductos'),
      callSheet('getVentas'),
    ]);
    productos = pRes.data || [];
    const allVentas = vRes.data || [];
    const today = new Date().toISOString().slice(0,10);
    recentSales = allVentas.slice(-20).reverse();
    const todaySales = allVentas.filter(v => (v.fecha||'').startsWith(today));
    sessionCount = todaySales.length;
    sessionUnits = todaySales.reduce((a,b) => a + (+b.cantidad||1), 0);
    updateUI();
  } catch(e) {
    loadDemoData();
  }
}

function loadDemoData() {
  productos = [
    {row:2, nombre:'Camiseta Negra M', cantidad:45},
    {row:3, nombre:'Pantalón Slim Fit', cantidad:28},
    {row:4, nombre:'Zapatillas Running', cantidad:7},
    {row:5, nombre:'Gorra Azul', cantidad:62},
    {row:6, nombre:'Bolso Cuero', cantidad:3},
  ];
  recentSales = [
    {producto:'Camiseta Negra M', cantidad:2, fecha:new Date().toISOString(), nota:''},
    {producto:'Gorra Azul', cantidad:5, fecha:new Date().toISOString(), nota:'cliente frecuente'},
  ];
  updateUI();
  toast('Modo demo activo — conecta tu Google Sheet', 'warn');
}

function updateUI() {
  // Select options
  const sel = document.getElementById('selProducto');
  sel.innerHTML = '<option value="">— Selecciona un producto —</option>';
  productos.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.row;
    opt.textContent = `${p.nombre}  (${p.cantidad} en stock)`;
    opt.dataset.nombre = p.nombre;
    opt.dataset.stock = p.cantidad;
    sel.appendChild(opt);
  });
  onProductoChange();
  renderRecent();
  updateCounters();
}

function updateCounters() {
  document.getElementById('statHoy').textContent = sessionCount;
  document.getElementById('statUnidades').textContent = sessionUnits;
  document.getElementById('sessionCounter').textContent = `${sessionCount} venta${sessionCount!==1?'s':''} hoy`;
}

function onProductoChange() {
  const sel = document.getElementById('selProducto');
  const opt = sel.selectedOptions[0];
  const preview = document.getElementById('preview');
  if(opt && opt.value) {
    document.getElementById('previewNombre').textContent = opt.dataset.nombre;
    document.getElementById('previewStock').textContent = opt.dataset.stock + ' und';
    preview.classList.add('show');
    const stock = +opt.dataset.stock;
    document.getElementById('cantidad').max = stock;
  } else {
    preview.classList.remove('show');
  }
}

function changeQty(delta) {
  const input = document.getElementById('cantidad');
  const val = Math.max(1, (+input.value||1) + delta);
  input.value = val;
}

// ─── REGISTRAR ───
async function registrarVenta() {
  const sel = document.getElementById('selProducto');
  const opt = sel.selectedOptions[0];
  if(!opt || !opt.value) { toast('Selecciona un producto', 'warn'); return; }
  const cantidad = +document.getElementById('cantidad').value || 1;
  const nota = document.getElementById('nota').value.trim();
  const nombre = opt.dataset.nombre;
  const stock = +opt.dataset.stock;
  if(cantidad > stock) { toast(`Stock insuficiente (${stock} disponibles)`, 'red'); return; }

  const btn = document.getElementById('btnRegistrar');
  btn.disabled = true; btn.textContent = 'Guardando…';

  try {
    await callSheet('addVenta', {
      nombre,
      cantidad,
      nota,
      row: opt.value
    });
    onSuccess(nombre, cantidad);
  } catch(e) {
    // Demo mode
    const p = productos.find(x=>x.row===+opt.value);
    if(p) p.cantidad = Math.max(0, p.cantidad - cantidad);
    recentSales.unshift({producto:nombre, cantidad, fecha:new Date().toISOString(), nota});
    sessionCount++; sessionUnits += cantidad;
    onSuccess(nombre, cantidad);
    // Re-populate select
    updateUI();
    document.getElementById('selProducto').value = '';
    onProductoChange();
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> Registrar Venta`;
  }
}

function onSuccess(nombre, cantidad) {
  document.getElementById('successMsg').textContent = `${cantidad}× ${nombre} registrado correctamente`;
  const overlay = document.getElementById('successOverlay');
  overlay.classList.add('show');
  setTimeout(() => {
    overlay.classList.remove('show');
    // Reset form
    document.getElementById('selProducto').value = '';
    document.getElementById('cantidad').value = 1;
    document.getElementById('nota').value = '';
    document.getElementById('preview').classList.remove('show');
  }, 1800);
  renderRecent();
  updateCounters();
}

function renderRecent() {
  const cont = document.getElementById('recentList');
  if(!recentSales.length) {
    cont.innerHTML = `<div class="empty"><svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg><p>Las ventas aparecerán aquí</p></div>`;
    return;
  }
  let html = '<div class="sales-list">';
  recentSales.slice(0,15).forEach(v => {
    const initial = (v.producto||'?')[0].toUpperCase();
    const t = v.fecha ? new Date(v.fecha).toLocaleTimeString('es-ES', {hour:'2-digit',minute:'2-digit'}) : '—';
    html += `<div class="sale-item">
      <div class="sale-avatar">${initial}</div>
      <div class="sale-body">
        <div class="sale-name">${esc(v.producto||'')}</div>
        <div class="sale-time">${t}${v.nota?' · '+esc(v.nota):''}</div>
      </div>
      <div class="sale-qty">×${v.cantidad||1}</div>
    </div>`;
  });
  html += '</div>';
  cont.innerHTML = html;
}

function toast(msg, type='green') {
  const colors = {green:'#43e97b', red:'#ff4757', warn:'#ffa502'};
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<div class="toast-dot" style="background:${colors[type]||colors.green}"></div>${msg}`;
  document.getElementById('toastContainer').appendChild(t);
  setTimeout(()=>t.remove(), 3500);
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

loadData();
</script>
</body>
</html>
